
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explora la colección de camisetas deportivas.">
    <title>Mi colección - Web Camisetas</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header>
    <h1>👕 Mi colección</h1>
    <p>Todas las camisetas en un mismo lugar</p>
</header>

<main class="contenedor-listado">

    <div class="cabecera-listado">
        <h2>Galería de camisetas</h2>
        <a href="index.html" class="boton-secundario">Volver al inicio</a>
    </div>

    <section class="filtros-listado">

        <input
            type="search"
            id="busqueda"
            placeholder="Buscar camiseta, jugador, marca..."
            aria-label="Buscar camisetas">

        <select id="filtroDeporte">
            <option value="">Todos los deportes</option>
        </select>

        <select id="filtroCaracter">
            <option value="">Club y selección</option>
        </select>

        <select id="filtroPais">
            <option value="">Todos los países</option>
        </select>

        <select id="filtroModelo">
            <option value="">Todos los modelos</option>
        </select>

    </section>

    <div class="controles-listado">

        <p id="contadorCamisetas" class="resumen-listado">
            Cargando colección...
        </p>

        <div class="opciones-listado">

            <label for="ordenarPor">Ordenar por:</label>

            <select id="ordenarPor">
                <option value="equipoAnio">Equipo y año</option>
                <option value="fecha">Fecha de incorporación</option>
                <option value="anio">Año</option>
                <option value="nombre">Equipo</option>
                <option value="pais">País</option>
                <option value="marca">Marca</option>
            </select>

            <button type="button" id="cambiarDireccion">
                Ascendente ↑
            </button>

            <div class="selector-vista">

                <button
                    type="button"
                    id="vistaCuadricula"
                    class="vista-activa"
                    aria-label="Vista de cuadrícula"
                    aria-pressed="true"
                    title="Vista de cuadrícula">
                    ▦
                </button>

                <button
                    type="button"
                    id="vistaListado"
                    aria-label="Vista de listado"
                    aria-pressed="false"
                    title="Vista de listado">
                    ☰
                </button>

            </div>

            <button type="button" id="limpiarFiltros">
                Limpiar filtros
            </button>

        </div>
    </div>

    <section id="galeriaCamisetas" class="galeria-camisetas"></section>

    <p id="mensajeListado" role="status" aria-live="polite"></p>

</main>

<footer>Colección personal de camisetas deportivas</footer>

<script src="js/listado.js"></script>

</body>
</html>
