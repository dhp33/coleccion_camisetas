<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo público de camisetas deportivas.">
    <title>Colección de Camisetas</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <h1>⚽ Colección de Camisetas</h1>
    </header>

    <main class="portada">

        <section class="acceso-coleccion">

            <div class="stat-total">
                <strong id="totalCamisetas">0</strong>
                <span>Camisetas registradas</span>
            </div>

            <a href="listado.html" class="boton-explorar">
                📋 Explorar colección
            </a>

        </section>

        <section class="estadisticas-publicas">
            <div id="estadisticasDeportes" class="estadisticas-deportes">
                <p class="mensaje-estadisticas">Cargando estadísticas...</p>
            </div>
        </section>

        <p id="estadoCarga" class="estado-carga"
           role="status" aria-live="polite"></p>

    </main>

    <footer>
        Colección personal de camisetas deportivas
    </footer>

    <script src="js/app.js"></script>

</body>
</html>
